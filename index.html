<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教學檔案庫 | 個人主頁</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <h1>教學檔案庫</h1>
            </div>

            <nav class="navigation">
                <div class="accordion">
                    <!-- 年級層級 -->
                    <details name="grade">
                        <summary>高一</summary>
                        <div class="details-content">
                            <details name="semester-1">
                                <summary>第一學期</summary>
                                <ul class="lesson-list">
                                    <li><a href="#">第一課</a></li>
                                    <li><a href="#">第二課</a></li>
                                </ul>
                            </details>
                            <details name="semester-1">
                                <summary>第二學期</summary>
                                <ul class="lesson-list">
                                    <li><a href="#">第一課</a></li>
                                </ul>
                            </details>
                        </div>
                    </details>

                    <details name="grade">
                        <summary>高二</summary>
                        <div class="details-content">
                            <details name="semester-2">
                                <summary>第一學期</summary>
                                <ul class="lesson-list">
                                    <li><a href="#">第一課</a></li>
                                </ul>
                            </details>
                            <details name="semester-2">
                                <summary>第二學期</summary>
                                <p class="empty">暫無資料</p>
                            </details>
                        </div>
                    </details>

                    <details name="grade">
                        <summary>高三</summary>
                        <div class="details-content">
                            <details name="semester-3">
                                <summary>第一學期</summary>
                                <p class="empty">暫無資料</p>
                            </details>
                            <details name="semester-3">
                                <summary>第二學期</summary>
                                <p class="empty">暫無資料</p>
                            </details>
                        </div>
                    </details>
                </div>
            </nav>

            <footer class="sidebar-footer">
                <p>© 2026</p>
            </footer>
        </aside>

        <main class="main-content">
            <div class="welcome-banner">
                <h2>歡迎使用</h2>
                <p>請從左側選單選擇分類以查看檔案</p>
            </div>
            <div class="content-placeholder">
                <!-- 資料將顯示於此 -->
            </div>
        </main>
    </div>
</body>
</html>
